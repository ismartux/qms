{% extends "shell/app.html" %}
{% block content %}

<div class="max-w-2xl mx-auto">

  <!-- Header -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Create Permission</h1>
    <p class="text-sm text-gray-600 mt-1">
      Define a new permission and assign roles later
    </p>
  </div>

  <!-- Form -->
  <form method="post" class="bg-white rounded-xl shadow p-6 space-y-6">
    {% csrf_token %}

    <!-- Role Code -->
    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">
        Permission Code
      </label>
      <input
        type="text"
        name="code"
        required
        placeholder="e.g. IPQC, EHS_ADMIN"
        class="form-field"
      >
      <p class="form-help">
        Internal code (UPPERCASE, no spaces)
      </p>
    </div>

    <!-- Role Name -->
    <div>
      <label class="block text-sm font-semibold text-gray-700 mb-1">
        Permission Name
      </label>
      <input
        type="text"
        name="name"
        required
        placeholder="e.g. In-Process Quality Control"
        class="form-field"
      >
      <p class="form-help">
        Human-readable display name
      </p>
    </div>

    <!-- Active Toggle -->
    <div class="flex items-center gap-3">
      <input
        type="checkbox"
        name="is_active"
        checked
        class="form-checkbox"
        id="is_active"
      >
      <label for="is_active" class="text-sm font-semibold text-gray-700">
        Active
      </label>
    </div>

    <!-- Actions -->
    <div class="flex gap-4 pt-4">
      <button type="submit" class="btn btn-primary">
        Create Permission
      </button>
      <a href="{% url 'identity:permission_list' %}" class="btn btn-secondary">
        Cancel
      </a>
    </div>

  </form>

</div>

{% endblock %}
