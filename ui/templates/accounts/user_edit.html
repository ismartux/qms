{% extends "shell/app.html" %}
{% block content %}

<div class="max-w-4xl mx-auto space-y-6">

    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-900">Edit User</h1>

        <div class="flex gap-3">
            <button id="resetPasswordBtn"
                class="px-4 py-2 text-sm font-medium rounded-lg border border-amber-300 text-amber-700 bg-amber-50 hover:bg-amber-100">
                <i class="fas fa-key mr-1"></i> Reset Password
            </button>

            <a href="{% url 'accounts:admin_users' %}"
               class="text-sm font-medium text-gray-500 hover:text-gray-900">
                <i class="fas fa-arrow-left mr-1"></i> Cancel
            </a>
        </div>
    </div>

    <input type="hidden" id="dept-url" value="{% url 'accounts:get_departments' 0 %}">
    <input type="hidden" id="reset-url" value="{% url 'accounts:reset_user_password' edit_user.id %}">
    <input type="hidden" id="csrf-token" value="{{ csrf_token }}">

    <form method="post" novalidate autocomplete="off">
        {% csrf_token %}

        <!-- Autofill Decoys -->
        <input type="text" name="username" autocomplete="username" style="display:none">
        <input type="password" name="password" autocomplete="current-password" style="display:none">

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-6">

            <h3 class="text-lg font-bold text-gray-900">Account Details</h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Employee ID</label>
                    <input type="text" name="employee_id"
                           value="{{ employee_profile.employee_id }}"
                           required
                           class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500 bg-white">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" name="email"
                           value="{{ edit_user.email }}"
                           class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                    <input type="text" name="first_name"
                           value="{{ edit_user.first_name }}"
                           class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                    <input type="text" name="last_name"
                           value="{{ edit_user.last_name }}"
                           class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500">
                </div>
            </div>

            <!-- Assignment -->
            <div class="border-t border-gray-100 pt-6">
                <h3 class="text-lg font-bold text-gray-900 mb-4">Assignment</h3>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Plant</label>
                        <select name="plant" id="plant"
                            class="w-full rounded-lg border-gray-300 bg-white border p-2.5 text-sm">
                            {% for plant in plants %}
                                <option value="{{ plant.id }}"
                                    {% if user_scope and user_scope.plant.id == plant.id %}selected{% endif %}>
                                    {{ plant.company.name }} – {{ plant.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
                        <select name="department"
                                id="department"
                                data-selected="{% if user_scope %}{{ user_scope.department.id }}{% endif %}"
                                class="w-full rounded-lg border-gray-300 bg-white border p-2.5 text-sm">
                            <option value="">Select Department</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
                        <select name="role"
                            class="w-full rounded-lg border-gray-300 bg-white border p-2.5 text-sm">
                            {% for role in roles %}
                                <option value="{{ role.id }}"
                                    {% if user_scope and user_scope.role.id == role.id %}selected{% endif %}>
                                    {{ role.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                </div>
            </div>

            <div class="flex justify-end gap-3 pt-6 border-t border-gray-100">
                <button type="submit"
                    class="px-6 py-2.5 bg-sky-600 text-white font-medium rounded-lg hover:bg-sky-700 shadow-sm">
                    Save Changes
                </button>
            </div>

        </div>
    </form>
</div>

<script>
// Load departments
(function () {
  const plantSelect = document.getElementById("plant");
  const deptSelect = document.getElementById("department");
  const baseUrl = document.getElementById("dept-url").value;
  const selectedDept = deptSelect.dataset.selected;

  function loadDepartments(plantId) {
    const url = baseUrl.replace("/0/", `/${plantId}/`);
    fetch(url).then(r=>r.json()).then(data => {
      deptSelect.innerHTML = '<option value="">Select Department</option>';
      data.departments.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d.id;
        opt.textContent = d.name;
        if(selectedDept && String(d.id) === String(selectedDept)) opt.selected = true;
        deptSelect.appendChild(opt);
      });
    });
  }

  if(plantSelect.value) loadDepartments(plantSelect.value);
  plantSelect.addEventListener("change", () => {
      deptSelect.dataset.selected = "";
      loadDepartments(plantSelect.value);
  });
})();

// Reset Password
document.getElementById("resetPasswordBtn").addEventListener("click", function() {

    if (!confirm("Generate new password for this user?")) return;

    const url = document.getElementById("reset-url").value;

    fetch(url, {
        method: "POST",
        headers: {
            "X-CSRFToken": document.getElementById("csrf-token").value,
            "X-Requested-With": "XMLHttpRequest"
        }
    })
    .then(response => {
        if (response.redirected) {
            window.location.href = response.url;
        } else {
            return response.json();
        }
    })
    .catch(() => alert("Server error"));
});
</script>

{% endblock %}
