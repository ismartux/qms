{% extends "shell/app.html" %}
{% block content %}
<div class="max-w-lg mx-auto mt-12">
    <div class="bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
        <div class="p-8 text-center">
            <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fas fa-check"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-900 mb-2">User Created Successfully</h2>
            <p class="text-gray-500 text-sm mb-6">Please save these credentials securely.</p>
            
            <div class="bg-gray-50 rounded-lg p-6 border border-gray-200 text-left space-y-4">
                <div class="flex justify-between border-b border-gray-200 pb-2">
                    <span class="text-sm text-gray-500">Username</span>
                    <span class="font-mono font-medium text-gray-900">{{ username }}</span>
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-sm text-gray-500">Password</span>
                        <span class="text-xs text-red-500 font-bold uppercase tracking-wide">Show Only Once</span>
                    </div>
                    <div class="text-2xl font-mono font-bold text-red-600 tracking-wider break-all">{{ password }}</div>
                </div>
            </div>

            <div class="mt-8">
                <a href="{% url 'accounts:admin_users' %}" class="w-full inline-flex justify-center items-center px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-lg text-white bg-sky-600 hover:bg-sky-700">
                    Done
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
