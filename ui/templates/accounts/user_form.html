{% extends "shell/app.html" %}
{% block content %}
<div class="max-w-4xl mx-auto space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-900">{% if form.instance.pk %}Edit User{% else %}Add User{% endif %}</h1>
        <a href="{% url 'accounts:admin_users' %}" class="text-sm font-medium text-gray-500 hover:text-gray-900">
            <i class="fas fa-arrow-left mr-1"></i> Cancel
        </a>
    </div>

    <form method="post" novalidate>
        {% csrf_token %}
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-6">
            
            <!-- Account Details -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input type="text" name="username" value="{{ form.instance.username.value|default:'' }}" required class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" name="email" value="{{ form.instance.email|default:'' }}" class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                    <input type="text" name="first_name" value="{{ form.instance.first_name|default:'' }}" class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                    <input type="text" name="last_name" value="{{ form.instance.last_name|default:'' }}" class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500">
                </div>
            </div>

            {% if not form.instance.pk %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 border-t border-gray-100 pt-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" name="password1" class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                    <input type="password" name="password2" class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500">
                </div>
            </div>
            {% endif %}

            <!-- Assignment -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 border-t border-gray-100 pt-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Plant</label>
                    <select name="plant" class="w-full rounded-lg border-gray-300 bg-white border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500">
                        <option value="">Select Plant</option>
                        {% for plant in plants %}<option value="{{ plant.id }}">{{ plant.name }}</option>{% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
                    <select name="role" class="w-full rounded-lg border-gray-300 bg-white border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500">
                        <option value="OPERATOR">Operator</option>
                        <option value="IPQC">IPQC</option>
                        <option value="PQE">PQE</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-end pt-6 border-t border-gray-100">
                <button type="submit" class="px-6 py-2.5 bg-sky-600 text-white font-medium rounded-lg hover:bg-sky-700 shadow-sm">Save User</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
