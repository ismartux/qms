{% extends "shell/app.html" %}
{% block content %}

<div class="max-w-4xl mx-auto space-y-6">

    <!-- Header -->
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Add New User</h1>
            <p class="text-sm text-gray-500">
                Create account credentials and assign roles.
            </p>
        </div>

        <div class="flex gap-3">
            <!-- Bulk Upload Button -->
            <a href="{% url 'accounts:bulk_user_upload' %}"
               class="px-4 py-2 text-sm font-medium rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100">
                <i class="fas fa-upload mr-1"></i> Bulk Upload
            </a>

            <a href="{% url 'accounts:admin_users' %}"
               class="text-sm font-medium text-gray-500 hover:text-gray-900 flex items-center">
                <i class="fas fa-arrow-left mr-1"></i> Cancel
            </a>
        </div>
    </div>

    <input type="hidden" id="dept-url" value="{% url 'accounts:get_departments' 0 %}">

    <form method="post" novalidate autocomplete="off" class="space-y-6">
        {% csrf_token %}

        <!-- Autofill Decoys -->
        <input type="text" name="username" autocomplete="username" style="display:none">
        <input type="password" name="password" autocomplete="current-password" style="display:none">

        <!-- ========================= -->
        <!-- Account Information -->
        <!-- ========================= -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h3 class="text-lg font-bold text-gray-900 mb-4">
                Account Information
            </h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Employee ID (Username)
                    </label>
                    <input type="text" name="employee_id" required
                        class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500 bg-white"
                        autocomplete="off" data-lpignore="true">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Email
                    </label>
                    <input type="email" name="email"
                        class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500"
                        autocomplete="off">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        First Name
                    </label>
                    <input type="text" name="first_name"
                        class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500"
                        autocomplete="off">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Last Name
                    </label>
                    <input type="text" name="last_name"
                        class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500"
                        autocomplete="off">
                </div>

            </div>

            <!-- Active / Staff Options -->
            <div class="mt-6 flex items-center gap-8">

                <label class="flex items-center gap-2 text-sm font-medium text-gray-700">
                    <input type="checkbox"
                           name="is_active"
                           checked
                           class="h-4 w-4 rounded border-gray-300 text-sky-600 focus:ring-sky-500">
                    Active Account
                </label>

                <label class="flex items-center gap-2 text-sm font-medium text-gray-700">
                    <input type="checkbox"
                           name="is_staff"
                           class="h-4 w-4 rounded border-gray-300 text-sky-600 focus:ring-sky-500">
                    Staff Access
                </label>

            </div>

            <!-- Info Box -->
            <div class="mt-4 bg-blue-50 border border-blue-100 rounded-lg p-3 flex items-start">
                <i class="fas fa-info-circle text-blue-500 mt-0.5 mr-2"></i>
                <p class="text-xs text-blue-700">
                    A secure password will be generated automatically and shown only once upon creation.
                </p>
            </div>
        </div>

        <!-- ========================= -->
        <!-- Assignment & Role -->
        <!-- ========================= -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h3 class="text-lg font-bold text-gray-900 mb-4">
                Assignment & Role
            </h3>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Plant
                    </label>
                    <select name="plant" id="plant"
                        class="w-full rounded-lg border-gray-300 bg-white border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500">
                        <option value="">Select Plant</option>
                        {% for plant in plants %}
                            <option value="{{ plant.id }}">
                                {{ plant.company.name }} – {{ plant.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Department
                    </label>
                    <select name="department" id="department"
                        class="w-full rounded-lg border-gray-300 bg-white border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500">
                        <option value="">Select Department</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Role
                    </label>
                    <select name="role"
                        class="w-full rounded-lg border-gray-300 bg-white border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500">
                        <option value="">Select Role</option>
                        {% for role in roles %}
                            <option value="{{ role.id }}">{{ role.name }}</option>
                        {% endfor %}
                    </select>
                </div>

            </div>
        </div>

        <!-- Submit -->
        <div class="flex justify-end gap-3">
            <button type="submit"
                class="px-6 py-2.5 bg-sky-600 text-white font-medium rounded-lg hover:bg-sky-700 shadow-sm">
                Create User
            </button>
        </div>

    </form>
</div>

<script>
document.getElementById("plant").addEventListener("change", function () {
    const baseUrl = document.getElementById("dept-url").value;
    const url = baseUrl.replace("/0/", `/${this.value}/`);

    fetch(url)
        .then(r => r.json())
        .then(data => {
            const dept = document.getElementById("department");
            dept.innerHTML = '<option value="">Select Department</option>';

            data.departments.forEach(d => {
                dept.innerHTML += `<option value="${d.id}">${d.name}</option>`;
            });
        });
});
</script>

{% endblock %}
