{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>Login | QIsmartuX</title>
    <!-- PWA / Mobile meta -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
    <meta name="msapplication-TileColor" content="#0ea5e9">
    <meta name="msapplication-config" content="{% static 'browserconfig.xml' %}">
    <link rel="icon" type="image/png" href="{% static 'icons/apple-touch-icon.png' %}">
    <!-- Tailwind (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Service Worker Registration -->
    <script>
        window.APP_CONFIG = {
            serviceWorkerUrl: "{% url 'service_worker' %}"
        };
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register(window.APP_CONFIG.serviceWorkerUrl);
            });
        }
    </script>
    <style>
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(#e0f2fe 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="h-screen w-full flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
        <!-- Header -->
        <div class="bg-sky-600 p-8 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-sky-500 to-blue-600 opacity-90"></div>
            <!-- Decorative circles -->
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-white opacity-10 rounded-full"></div>
            <div class="absolute bottom-0 left-0 w-24 h-24 bg-white opacity-10 rounded-full"></div>
            
            <div class="relative z-10">
                <div class="w-16 h-16 bg-white/20 backdrop-blur-sm rounded-xl mx-auto flex items-center justify-center mb-4 border border-white/30">
                    <i class="fas fa-industry text-white text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">QIsmartuX</h1>
                <p class="text-sky-100 text-sm mt-1 font-medium">Manufacturing Control System</p>
            </div>
        </div>

        <!-- Form -->
        <div class="p-8">
            {% if messages %}
                <div class="mb-6">
                    {% for message in messages %}
                    <div class="flex items-center p-4 mb-3 text-sm text-red-800 rounded-lg bg-red-50 border border-red-100" role="alert">
                        <i class="fas fa-exclamation-circle flex-shrink-0 mr-2"></i>
                        <span>{{ message }}</span>
                    </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="post" class="space-y-6">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
                
                <div>
                    <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">Employee ID / Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-user text-gray-400"></i>
                        </div>
                        <input type="text" name="username" id="username" required 
                            class="pl-10 w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition-all outline-none text-gray-900 placeholder-gray-400"
                            placeholder="Enter your ID">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" name="password" id="password" required 
                            class="pl-10 w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition-all outline-none text-gray-900 placeholder-gray-400"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center text-gray-600 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 text-sky-600 border-gray-300 rounded focus:ring-sky-500">
                        <span class="ml-2">Remember me</span>
                    </label>
                    <a href="#" class="text-sky-600 hover:text-sky-700 font-medium transition-colors">Forgot password?</a>
                </div>

                <button type="submit" 
                    class="w-full bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-700 hover:to-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-sky-500/30 transform transition hover:-translate-y-0.5 active:translate-y-0 focus:ring-4 focus:ring-sky-500/20">
                    Sign In
                </button>
            </form>

            <div class="mt-8 text-center">
                <p class="text-xs text-gray-500">
                    &copy; 2026 QIsmartuX Enterprise. <br>
                    Secured by Industrial Grade Encryption.
                </p>
            </div>
        </div>
    </div>

</body>
</html>
