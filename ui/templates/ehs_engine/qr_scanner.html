{% extends "shell/app.html" %}
{% block title %}EHS QR Scanner{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto py-10 px-4 text-center">

    <h2 class="text-2xl font-bold mb-4">Scan EHS Form QR</h2>

    <div id="reader" class="rounded-xl overflow-hidden shadow-lg border"></div>

    <p class="text-sm text-gray-500 mt-4">
        Point camera at QR code to open audit form.
    </p>

</div>

<!-- QR Library -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<script>
    function onScanSuccess(decodedText, decodedResult) {
        console.log(`QR Code detected: ${decodedText}`);

        // Stop scanner after successful scan
        html5QrcodeScanner.clear().then(_ => {
            // Redirect to scanned URL
            window.location.href = decodedText;
        }).catch(error => {
            console.error("Failed to clear scanner", error);
        });
    }

    function onScanFailure(error) {
        // You can log scan errors if needed
        console.warn(`QR scan error: ${error}`);
    }

    let html5QrcodeScanner = new Html5QrcodeScanner(
        "reader",
        {
            fps: 10,
            qrbox: { width: 250, height: 250 }
        },
        false
    );

    html5QrcodeScanner.render(onScanSuccess, onScanFailure);
</script>

{% endblock %}
