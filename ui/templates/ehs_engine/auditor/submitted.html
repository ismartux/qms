{% extends "shell/app.html" %}
{% block title %}Submission Completed{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-20 bg-white p-8 rounded-2xl shadow text-center">

  <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
    <i class="fas fa-check text-green-600 text-2xl"></i>
  </div>

  <h2 class="text-2xl font-bold text-gray-800 mb-2">
    Inspection Submitted
  </h2>

  <p class="text-gray-600 mb-6">
    This record is now locked and under review.
  </p>

  <a href="{{ dashboard_url }}"
     class="inline-flex items-center px-6 py-3 bg-sky-600 text-white font-semibold rounded-xl hover:bg-sky-700 transition">
    Back to Dashboard
  </a>

</div>
{% endblock %}
