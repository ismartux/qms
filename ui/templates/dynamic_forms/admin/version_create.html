{% extends "shell/app.html" %}
{% block content %}

<div class="max-w-xl mx-auto space-y-6">

    <div>
        <h1 class="text-2xl font-bold text-gray-900">
            New Version – {{ template.name }}
        </h1>
        <p class="text-gray-500">
            Create a new locked version of this form template.
        </p>
    </div>

    <form method="post"
          class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
        {% csrf_token %}

        <div class="p-6 space-y-6">

            <!-- ===================== -->
            <!-- VERSION NUMBER -->
            <!-- ===================== -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Version Number <span class="text-red-600">*</span>
                </label>
                <input
                    type="number"
                    name="version_number"
                    min="1"
                    required
                    class="w-full rounded-lg border-gray-300 border p-2.5 text-sm focus:ring-sky-500 focus:border-sky-500"
                    placeholder="e.g. 1"
                >
                <p class="mt-1 text-xs text-gray-500">
                    Must be unique per template.
                </p>
            </div>

            <!-- ===================== -->
            <!-- FLAGS -->
            <!-- ===================== -->
            <div class="space-y-3">

                <label class="flex items-center gap-2">
                    <input type="checkbox"
                           name="is_active"
                           class="w-4 h-4 text-sky-600 border-gray-300 rounded">
                    <span class="text-sm font-medium text-gray-900">
                        Set as active version
                    </span>
                </label>

                <label class="flex items-center gap-2">
                    <input type="checkbox"
                           name="is_published"
                           class="w-4 h-4 text-sky-600 border-gray-300 rounded">
                    <span class="text-sm font-medium text-gray-900">
                        Publish this version
                    </span>
                </label>

            </div>
        </div>

        <!-- ===================== -->
        <!-- ACTIONS -->
        <!-- ===================== -->
        <div class="bg-gray-50 px-6 py-4 border-t border-gray-200 flex justify-end gap-3">
            <a href="{% url 'dynamic_forms_admin:template_detail' template.id %}"
               class="btn-secondary">
                Cancel
            </a>
            <button type="submit" class="btn-primary">
                Create Version
            </button>
        </div>
    </form>
</div>

{% endblock %}
