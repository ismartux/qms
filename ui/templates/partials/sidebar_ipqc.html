{# ================= IPQC ================= #}

{% if can_view_analytics or is_admin %}
<div class="nav-dropdown {% if current_url in 'ipqc_dashboard forms_list form_runtime submission_detail' %}open{% endif %}">

  <!-- ===== Parent: IPQC ===== -->
  <div class="nav-item nav-dropdown-toggle"
       onclick="toggleNavDropdown(this)"
       data-tooltip="IPQC">

    <div class="flex items-center gap-3">
      <i class="fas fa-clipboard-list"></i>
      <span class="nav-text">IPQC</span>
    </div>

    <i class="fas fa-chevron-down nav-text text-xs"></i>
  </div>

  <!-- ===== Dropdown Menu ===== -->
  <div class="nav-dropdown-menu">

    <a href="{% url 'ui:operator_home' %}"
       class="nav-sub-item {% if current_url == 'operator_home' %}active{% endif %}"
       data-tooltip="IPQC Home">
      <i class="fas fa-house"></i>
      <span class="nav-text">IPQC Home</span>
    </a>

    <a href="{% url 'ui:work_context_list' %}"
       class="nav-sub-item {% if current_url == 'work_context_list' %}active{% endif %}"
       data-tooltip="Work List">
      <i class="fas fa-briefcase"></i>
      <span class="nav-text">Work List</span>
    </a>

    <a href="{% url 'ui:ipqc_dashboard' %}"
       class="nav-sub-item {% if current_url == 'ipqc_dashboard' %}active{% endif %}"
       data-tooltip="Submissions">
      <i class="fas fa-file-lines"></i>
      <span class="nav-text">Submissions</span>
    </a>

    <a href="{% url 'ui:forms_list' %}"
       class="nav-sub-item {% if current_url in 'forms_list form_runtime' %}active{% endif %}"
       data-tooltip="Forms">
      <i class="fas fa-pen-to-square"></i>
      <span class="nav-text">Forms</span>
    </a>

  </div>
</div>
{% endif %}
