{% if can_approve_ipqc %}
<div class="nav-dropdown {% if current_url == 'approval_pending_dashboard' %}open{% endif %}">

  <!-- ===== Parent Item ===== -->
  <div class="nav-item nav-dropdown-toggle"
       onclick="toggleNavDropdown(this)"
       data-tooltip="Form Approvals">

    <div class="flex items-center gap-3">
      <i class="fas fa-clipboard-check"></i>
      <span class="nav-text">Form Approvals</span>

      {% if ipqc_pending_approval_count > 0 %}
      <span class="approval-parent-badge px-2 py-0.5 text-xs font-bold bg-red-500 text-white rounded-full">
        {{ ipqc_pending_approval_count }}
      </span>
      {% endif %}
    </div>

    <i class="fas fa-chevron-down nav-text text-xs"></i>
  </div>

  <!-- ===== Dropdown Menu ===== -->
  <div class="nav-dropdown-menu">

    <a href="{% url 'ui:approval_pending_dashboard' %}"
       class="nav-sub-item {% if current_url == 'approval_pending_dashboard' %}active{% endif %}"
       data-tooltip="Pending Approvals">

      <i class="fas fa-hourglass-half"></i>
      <span class="nav-text">Pending Approvals</span>

      {% if ipqc_pending_approval_count > 0 %}
      <span class="ml-2 text-xs bg-red-500 text-white px-2 py-0.5 rounded-full">
        {{ ipqc_pending_approval_count }}
      </span>
      {% endif %}

    </a>

  </div>
</div>
{% endif %}
