server {
    server_name qms.ismartux.com;

    client_max_body_size 250M;

    # Static assets for QMS
    location /static/ {
        alias /home/mrsingh29/apps/qms/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media uploads for QMS
    location /media/ {
        alias /home/mrsingh29/apps/qms/media/;
    }

    # Static assets for DCC
    location /dcc-static/ {
        alias /home/mrsingh29/apps/qms/dcc/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location /dcc/static/ {
        alias /home/mrsingh29/apps/qms/dcc/backend/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # Media uploads for DCC
    location /dcc-media/ {
        alias /home/mrsingh29/apps/qms/dcc/backend/media/;
    }

    location /dcc/media/ {
        alias /home/mrsingh29/apps/qms/dcc/backend/media/;
    }

    # Block hidden files
    location ~ /\. {
        access_log off;
        log_not_found off;
        return 444;
    }

    # Block sensitive files
    location ~* \.(env|ini|log|sql|bak)$ {
        access_log off;
        log_not_found off;
        return 444;
    }

    # DCC Django API (proxied to port 8014)
    location /dcc-api/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8014/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /dcc/api/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8014/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # DCC Django Admin portal
    location /dcc-admin/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8014/admin/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /dcc/admin/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8014/admin/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Redirect /dcc to /dcc/
    location = /dcc {
        return 301 /dcc/;
    }

    # DCC Frontend SPA (/dcc/)
    location ^~ /dcc/ {
        alias /home/mrsingh29/apps/qms/dcc/frontend/dist/;
        index index.html;
        try_files $uri $uri/ /dcc/index.html;
    }

    # QMS Application (Root /)
    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8003;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/qms.ismartux.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/qms.ismartux.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = qms.ismartux.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name qms.ismartux.com;
    listen 80;
    return 404; # managed by Certbot
}

